name: vc_catalog_update_product_quality_data
description: |
  Save quality evaluations of products (of any entity type) in ONE call — one entry per product and
  quality target (e.g. one product scored against 3 targets = 3 entries; 5 products
  against 1 target = 5 entries). Call it once, after all evaluations are done.

  No record ids needed: the server keeps one evaluation per product and target —
  an existing evaluation of the same product and target is overwritten, otherwise a
  new one is created.

  Replace semantics: `readinessScore` and `suggestions` fully replace the previously
  saved evaluation — always send the complete, final suggestions text.
require_approval: false

parameters:
  type: object
  required:
    - entityType
    - evaluations
  properties:
    entityType:
      type: string
      description: |
        Full type name of the evaluated entity. Pass exactly the value given in your instructions.
    evaluations:
      type: array
      minItems: 1
      maxItems: 100
      description: One entry per evaluated product and quality target.
      items:
        type: object
        additionalProperties: false
        required:
          - productId
          - targetId
          - readinessScore
          - suggestions
        properties:
          productId:
            type: string
            description: |
              Id of the evaluated product (of the `entityType` type), e.g. `"76b6d640-e398-472b-85fa-9583a6b8e694"`.
              Use the product `id` — not its SKU/code or name.
          targetId:
            type: string
            description: Id of the quality target the product was evaluated against.
          readinessScore:
            type: integer
            minimum: 0
            maximum: 100
            description: Readiness of the product for this target, 0..100.
          suggestions:
            type: string
            description: |
              Markdown text: a "Quality score" heading, a scoring table (points per criterion
              of the target), then a "Suggestions" heading with improvement suggestions.
              For a product that meets every criterion only the score heading and the table.

execution:
  endpoint: /api/catalogquality/data/bulkupdate
  method: POST
  mappings:
    request:
      body: |
        {%- set items = [] -%}
        {%- for e in evaluations -%}
          {%- set _ = items.append({
            "entityId": e.productId,
            "entityType": entityType,
            "targetId": e.targetId,
            "readinessScore": e.readinessScore,
            "suggestions": e.suggestions
          }) -%}
        {%- endfor -%}
        {{ items }}
    response: ~

#permission:
#  - catalog-quality:update

tags:
  - product
  - evaluation
  - quality
