name: vc_quality_search_quality_targets
description: |
  List the quality targets of ONE entity type — the scoring profiles an entity of this type
  can be evaluated against (e.g. "Publication readiness for Chinese marketplaces").
  Returns each target's `id`, `name` and `description`, without its scoring prompt.
  Call it with only `entityType` to get all targets of that type, then pick the one whose
  name and description best match the user's request by meaning — users rarely say a
  target's exact name. Load the chosen target's scoring rules with `vc_quality_get_quality_target`.
require_approval: false

parameters:
  type: object
  properties:
    entityType:
      type: string
      description: |
        Full type name of the entities to evaluate — only targets of this type are returned.
        Pass exactly the value given in your instructions.
    skip:
      type: integer
      default: 0
      minimum: 0
    take:
      type: integer
      default: 100
      minimum: 1
      maximum: 100
  required:
    - entityType

execution:
  endpoint: /api/catalogquality/target/search
  method: POST
  mappings:
    request:
      body:
        entityType: "{{entityType}}"
        skip: "{{skip}}"
        take: "{{take}}"
    response:
      items: "results[*].{id: id, name: name, description: description}"
      totalCount: "totalCount"

#permission:
#  - catalog-quality:read

tags:
  - quality
  - evaluation
  - search
  - read
