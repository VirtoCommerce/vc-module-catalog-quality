name: vc_quality_get_quality_target
description: |
  Load ONE quality target by id with its scoring `prompt` — the rules an entity must be
  evaluated against for this target: criteria, weights, required data. Call it after
  choosing the target with `vc_quality_search_quality_targets`.
  An empty result (no `id`) means there is no target with this id.
require_approval: false

parameters:
  type: object
  required:
    - targetId
  properties:
    targetId:
      type: string
      description: Id of the quality target, as returned by `vc_quality_search_quality_targets`.

execution:
  endpoint: /api/catalogquality/target/{targetId}
  method: GET
  mappings:
    request:
      body: ~
    response:
      id: "id"
      name: "name"
      description: "description"
      prompt: "prompt"

#permission:
#  - catalog-quality:read

tags:
  - quality
  - evaluation
  - read
