name: vc_quality_get_quality_data
description: |
  Load the previously saved quality evaluation of ONE entity (e.g. a catalog product) for ONE quality
  target: the saved `readinessScore` and `suggestions`, and when it was last evaluated.
  An entity has a separate evaluation per target. Use it to compare a new score with
  the previous one — it is NOT needed before saving.
  An empty result (no `id`) means the entity was never evaluated for this target.
require_approval: false

parameters:
  type: object
  required:
    - entityId
    - entityType
    - targetId
  properties:
    entityId:
      type: string
      description: |
        Id of the evaluated entity (of the `entityType` type), e.g. `"76b6d640-e398-472b-85fa-9583a6b8e694"`.
        Use the entity `id` — not its SKU/code or name.
    entityType:
      type: string
      description: |
        Full type name of the evaluated entity. Pass exactly the value given in your instructions.
    targetId:
      type: string
      description: Id of the quality target the evaluation is for.

execution:
  endpoint: /api/catalogquality/data/getbyentity
  method: GET
  mappings:
    request:
      query:
        entityId: "{{entityId}}"
        entityType: "{{entityType}}"
        targetId: "{{targetId}}"
      body: ~
    response:
      id: "id"
      readinessScore: "readinessScore"
      suggestions: "suggestions"
      modifiedDate: "modifiedDate"

#permission:
#  - catalog-quality:read

tags:
  - evaluation
  - quality
  - read
