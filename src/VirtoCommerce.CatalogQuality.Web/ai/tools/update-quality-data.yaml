name: vc_quality_update_quality_data
description: |
  Save quality evaluations of entities of ONE type (e.g. catalog products) in ONE call — one entry
  per entity and quality target (e.g. one entity scored against 3 targets = 3 entries; 5 entities
  against 1 target = 5 entries). Call it once, after all evaluations are done.

  No record ids needed: the server keeps one evaluation per entity and target —
  an existing evaluation of the same entity and target is overwritten, otherwise a
  new one is created.

  Replace semantics: `readinessScore` and `suggestions` fully replace the previously
  saved evaluation — always send the complete, final suggestions text.
require_approval: false

parameters:
  type: object
  required:
    - entityType
    - evaluations
  properties:
    entityType:
      type: string
      description: |
        Full type name of the evaluated entities. Pass exactly the value given in your instructions.
    evaluations:
      type: array
      minItems: 1
      maxItems: 100
      description: One entry per evaluated entity and quality target.
      items:
        type: object
        additionalProperties: false
        required:
          - entityId
          - targetId
          - readinessScore
          - suggestions
        properties:
          entityId:
            type: string
            description: |
              Id of the evaluated entity (of the `entityType` type), e.g. `"76b6d640-e398-472b-85fa-9583a6b8e694"`.
              Use the entity `id` — not its SKU/code or name.
          targetId:
            type: string
            description: Id of the quality target the entity was evaluated against.
          readinessScore:
            type: integer
            minimum: 0
            maximum: 100
            description: Readiness of the entity for this target, 0..100.
          suggestions:
            type: string
            description: |
              Markdown text: a "Quality score" heading, a scoring table (points per criterion
              of the target), then a "Suggestions" heading with improvement suggestions.
              For an entity that meets every criterion only the score heading and the table.

execution:
  endpoint: /api/catalogquality/data/bulkupdate
  method: POST
  mappings:
    request:
      body: |
        {%- set items = [] -%}
        {%- for e in evaluations -%}
          {%- set _ = items.append({
            "entityId": e.entityId,
            "entityType": entityType,
            "targetId": e.targetId,
            "readinessScore": e.readinessScore,
            "suggestions": e.suggestions
          }) -%}
        {%- endfor -%}
        {{ items }}
    response: ~

#permission:
#  - catalog-quality:update

tags:
  - evaluation
  - quality
