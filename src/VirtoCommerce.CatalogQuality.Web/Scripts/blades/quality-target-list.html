<div class="blade-static __bottom" ng-if="pageSettings.itemsPerPageCount < pageSettings.totalItems" ng-include="'pagerTemplate.html'"></div>
<div class="blade-content __medium-wide">
  <div class="blade-inner">
    <div class="inner-block">
      <div class="table-wrapper" ng-init="setGridOptions({
           useExternalSorting: true,
           rowTemplate: 'quality-target-list.row.html',
           rowHeight: 40,
           columnDefs: [
             { name: 'name', displayName: 'catalog-quality.blades.quality-target-list.labels.name', sort: { direction: uiGridConstants.ASC } }
           ]})">
        <div ui-grid="gridOptions" ui-grid-auto-resize ui-grid-save-state ui-grid-selection ui-grid-resize-columns ui-grid-height></div>
      </div>
    </div>
  </div>
</div>

<script type="text/ng-template" id="quality-target-list.row.html">
  <div ng-click="grid.appScope.selectNode(row.entity)"
       ng-repeat="(colRenderIndex, col) in colContainer.renderedColumns track by col.uid"
       ui-grid-one-bind-id-grid="rowRenderIndex + '-' + col.uid + '-cell'"
       class="ui-grid-cell"
       ng-class="{ 'ui-grid-row-header-cell': col.isRowHeader, '__selected': row.entity.id === grid.appScope.selectedNodeId }"
       role="{{ col.isRowHeader ? 'rowheader' : 'gridcell' }}"
       ui-grid-cell></div>
</script>
