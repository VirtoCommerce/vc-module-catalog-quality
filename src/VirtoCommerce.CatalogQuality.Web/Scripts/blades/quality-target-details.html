<div class="blade-content __large-wide">
  <div class="blade-inner">
    <div class="inner-block">
      <form class="form" name="formScope">
        <fieldset ng-disabled="!blade.hasUpdatePermission()" ng-init="setForm(formScope)">
          <div class="form-group">
            <label class="form-label">{{ 'catalog-quality.blades.quality-target-details.labels.name' | translate }}</label>
            <div class="form-input">
              <input ng-model="blade.currentEntity.name" maxlength="256" required focus-on />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">{{ 'catalog-quality.blades.quality-target-details.labels.description' | translate }}</label>
            <div class="form-input">
              <textarea ng-model="blade.currentEntity.description" rows="3" maxlength="1024" placeholder="{{ 'catalog-quality.blades.quality-target-details.placeholders.description' | translate }}"></textarea>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">{{ 'catalog-quality.blades.quality-target-details.labels.prompt' | translate }}</label>
            <div class="form-input">
              <textarea ng-model="blade.currentEntity.prompt" rows="25" placeholder="{{ 'catalog-quality.blades.quality-target-details.placeholders.prompt' | translate }}"></textarea>
            </div>
          </div>
        </fieldset>
      </form>
    </div>
  </div>
</div>
